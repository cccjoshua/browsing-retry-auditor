_ > nanoagent.plugin.v0001.ManifestConfig:
id: browsing-retry-auditor
name: Browsing Log Retry Auditor
version: 0.1.3
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  log_info:
    description: Say how many events a seed's browsing log holds and how many one read returns
  read_log:
    description: Read up to 250 events of the browsing log from an offset, each with its raw URL, canonical page state, action and outcome
  canonical_states:
    description: Turn up to 250 raw URLs into canonical page states, dropping session, time, ad and tracking parameters
  pair_attempts:
    description: Group the whole log by (canonical page state, action), listing each pair's outcomes in step order
  scan_log:
    description: The whole log and its retries; the reference, never shown to the agent

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  audit-retries:
    description: Find every action a web agent retried after it had already failed
    runner: agent
    tools: [pair_attempts]
    reference: scan_log
    instructions: |-
      Work in two steps: call pair_attempts, then submit. Keep your reasoning short.
      Step 1: call pair_attempts once with the seed. It returns every (state, action) pair of the log with its outcomes in step order, e.g. [ok, fail, fail, ok].
      For each pair, find its first fail. retry_count is the number of outcomes that come after that first fail. A pair with no fail, or whose only fail is its last outcome, has no retry and is left out.
      Example: [ok, fail, fail, ok] gives retry_count 2; [fail] and [ok, ok, fail] give none; [fail, ok] gives 1.
      Step 2: submit retries: one entry per pair with retry_count of 1 or more, with its state and action exactly as pair_attempts gave them. Each pair once; submit an empty list when nothing was retried.
